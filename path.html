<script src="config.js"></script>
<script src="common.js"></script>
<script src="waitlist.js"></script>
<script src="course_map.js"></script>
<script src="course.js"></script>
<script>
"use strict";
const d = Course.doneSets(), esc = Course.esc;
let all = 0, got = 0;
function card(sec) {
  const n = sec.items.filter((it) => Course.isDone(it, d)).length;
  if (sec.main) { all += sec.items.length; got += n; }
  const items = sec.items.map((it) => {
    const ok = Course.isDone(it, d);
    const text = it.k === "L" ? `<b>${it.no}</b> ${esc(it.label)}` : esc(it.label);
    return `<li class="k-${it.k}${ok ? " ok" : ""}"><a href="${it.href}"${it.k === "G" ? ` data-g="${esc(it.id)}"` : ""}>${ok ? "✓ " : ""}${text}</a></li>`;
  }).join("");
  const head = sec.main ? `<span class="ch-no">${sec.id}</span>` : `<span class="ch-no side">支</span>`;
  const after = sec.after ? `<p class="why">建議在第 ${sec.after} 章之後</p>` : "";
  return `<section class="chapter${n === sec.items.length ? " done" : ""}" id="ch${sec.id}"><div class="chap-head">${head}<div><h2>${esc(sec.t)}</h2>` +
    `<p>${esc(sec.why)}</p>${after}</div></div>` +
    `<div class="ch-can"><b>學完你會</b><ul>${sec.can.map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>` +
    `<div class="bar"><i style="width:${Math.round(100 * n / sec.items.length)}%"></i></div><p class="why">${n} / ${sec.items.length}</p>` +
    `<details${sec.main ? " open" : ""}><summary>內容（${sec.items.length} 項）</summary><ol class="path-items">${items}</ol></details></section>`;
}
document.getElementById("chapters").innerHTML = Course.data.chapters.map(card).join("");
document.getElementById("tracks").innerHTML = Course.data.tracks.map(card).join("");
document.getElementById("allbar").style.width = Math.round(100 * got / all) + "%";
document.getElementById("alltext").textContent = `主線進度 ${got} / ${all}`;
const nxt = Course.firstOpen();
document.getElementById("resume").innerHTML = nxt
  ? `<a class="btnlink go big" href="${nxt.it.href}">${got ? "繼續上次" : "從第一課開始"}：${esc(Course.label(nxt.it))} ›</a><span class="why">${esc(Course.secName(nxt.sec))}</span>`
  : `<b>主線全部完成！</b> 可以挑戰支線的技能檢定題。`;
document.querySelectorAll("[data-g]").forEach((a) => a.addEventListener("click", () => Course.markPage(a.dataset.g)));
renderWaitlist(document.getElementById("wl"), "path", "想在 Pro 開放時第一個知道嗎？");
</script>
</body>
</html>
