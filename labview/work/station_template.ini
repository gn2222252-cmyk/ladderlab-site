; PM5 test station - settings template (W19)
; Program copies this file to C:\ProgramData\MyCompany\PM5Station\station.ini on first run.
; Edit the copy, not this template.

[Station]
id=ST01
limits=\\fileserver\qa\PM5\limits.csv

[Instruments]
psu=USB0::0x2184::0x0040::GPD000001::INSTR
dmm=TCPIP0::127.0.0.1::5562::SOCKET
load=USB0::0x0000::0x0000::LOAD000001::INSTR

[Paths]
outbox=C:\ProgramData\MyCompany\PM5Station\outbox
log=C:\ProgramData\MyCompany\PM5Station\log
report=C:\ProgramData\MyCompany\PM5Station\report
python=C:\Program Files\PM5Station\py\python.exe
yield_script=C:\Program Files\PM5Station\yield_report.py

[MES]
url=http://mes.local/api
route_timeout_ms=2000
upload_timeout_ms=5000
