<link rel="stylesheet" href="lab.css?v=89a89d8063">

<body>
<header class="top">
  <a class="brand" href="../index.html">LadderLab <span>梯圖實驗室</span></a>
  <nav class="topnav"><a href="../path.html">課程</a><a href="index.html">LabVIEW 課程</a><a href="labs.html">動畫實驗室</a><a href="lab-array.html" class="here">陣列</a></nav>

<main class="lab-main">
  <p class="crumb"><a href="index.html">LabVIEW 上位機課程</a> · <a href="labs.html">動畫實驗室</a></p>
  <h1>陣列函式動畫實驗室</h1>
  <p class="lead-text">選一個陣列函式，改左邊的輸入，按「執行」看元素怎麼搬到輸出。想練功就打開「先預測」：先寫出你覺得的答案，再執行對答案。</p>

  <div class="lab-grid">
    <nav class="lab-list" id="fnlist" aria-label="函式"></nav>

    <section class="lab-stage">
      <div class="lab-head">
        <div class="node" id="node"></div>
        <div>
          <h2 id="fname"></h2>
          <p class="fdesc" id="fdesc"></p>
        </div>
      </div>

      <div class="lab-io">
        <div class="lab-in" id="inputs"></div>
        <div class="lab-run">
          <button type="button" class="go big" id="run">▶ 執行</button>
          <label class="check small"><input type="checkbox" id="predict"> 先預測</label>
          <label class="check small"><input type="checkbox" id="slow"> 慢動作</label>
        </div>
        <div class="lab-out">
          <div class="pred" id="predbox" hidden>
            <label>你的答案 <input id="predin" placeholder="例如 1, 9, 2"></label>
            <span class="why" id="predhint"></span>
          </div>
          <div id="outputs"></div>
          <p class="verdict-line" id="verdict"></p>
        </div>
      </div>

      <div class="lab-notes" id="notes"></div>
      <div class="lab-challenge">
        <h3>隨機挑戰</h3>
        <p class="why">按「出一題」，輸入會隨機改變，先預測再執行。答對會記在下面。</p>
        <button type="button" id="newq">出一題</button> <span class="why" id="score">答對 0 / 0</span>
      </div>
    </section>
  </div>
  <div class="anim-layer" id="layer" aria-hidden="true"></div>
</main>
