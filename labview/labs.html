<style>
  .hub { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; margin: 16px 0; }
  .hub a.card { display: block; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--card); color: inherit; text-decoration: none; transition: transform .15s, box-shadow .15s; position: relative; }
  .hub a.card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 0, 0, .12); border-color: var(--on); }
  .hub h2 { margin: 0 0 4px; font-size: 19px; display: flex; align-items: center; gap: 8px; }
  .hub .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; font: 700 15px ui-monospace, Consolas, monospace; flex: none; }
  .hub p { margin: 6px 0; font-size: 14px; }
  .hub ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--mute); }
  .hub .les { font-size: 12px; color: var(--mute); margin-top: 8px; }
  .hub .seen { position: absolute; right: 12px; top: 12px; font-size: 12px; color: #1f9d3a; font-weight: 700; }
  .order { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; margin: 8px 0; }
  .order a { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; text-decoration: none; color: inherit; background: var(--card); }
</style>

<main class="lab-main">

  <h1>LabVIEW 動畫實驗室</h1>
  <p class="lead-text">不用安裝 LabVIEW。每個實驗室挑一個最容易搞混的觀念，讓你自己改輸入、看它一步一步怎麼跑。課程裡每一課的「動畫練習」也會連到這裡。</p>
  <p class="why">第一次來，建議照這個順序：</p>
  <div class="order" id="order"></div>
  <div class="hub" id="hub"></div>
  <p class="why" id="prog"></p>
</main>
<footer><p>LabVIEW 為 NI 之商標。本站為獨立製作，與 NI 無關。</p></footer>
<script>
(function () {
  var LABS = [
    { f: 'lab-numeric.html', n: '數值', ic: '123', c: '#e8820c', d: '整數算到頭會繞回來，浮點數轉整數卻是夾住。', t: ['整數溢位轉盤（U8、I8、U16、I16）', '四種捨入函式的數線', '商與餘數、毫秒換時分秒'], l: '第 3 課、C2' },
    { f: 'lab-bool.html', n: '布林', ic: 'TF', c: '#1f9d3a', d: '按鈕的六種機械動作，按下去才知道差在哪。', t: ['六種機械動作的即時時間圖', '邏輯閘真值表與位元遮罩', 'Select、In Range and Coerce'], l: '第 3、17 課、C2、C16' },
    { f: 'lab-flow.html', n: '資料流', ic: '→', c: '#0369a1', d: '節點等輸入到齊才執行；沒連線就不保證先後。', t: ['小球沿線流動、節點等到齊才執行', '平行與順序：沒連線不保證誰先', '線分叉就是複製一份', '迴圈的輸入、輸出通道什麼時候讀、什麼時候送'], l: '第 2、4 課、C1、C3' },
    { f: 'lab-loop.html', n: '迴圈', ic: '⟳', c: '#6b6b6b', d: '跑幾圈、輸出什麼，一圈一圈看。', t: ['While 與 For、四種輸出通道', 'Shift Register 有沒有接初始值', 'Wait 與 Wait Until Next ms Multiple'], l: '第 4、5、7 課、C3' },
    { f: 'lab-time.html', n: '時間', ic: 'ms', c: '#0e7490', d: 'Tick Count 量間隔、時間戳記幾點幾分；逾時判定不要用長 Wait。', t: ['Tick Count 是 U32，跨過繞回點照樣能相減', '看門狗：心跳 3 秒沒變就判斷斷線', '時間戳與 Format Date/Time String 格式碼'], l: '第 5、19 課、C3、F3' },
    { f: 'lab-struct.html', n: '結構', ic: '?', c: '#1e6fff', d: 'Case 走哪一頁、事件怎麼排隊、狀態機怎麼換狀態。', t: ['Case 選擇器：範圍、Default、捨入、大小寫', 'Event 事件排隊與 Timeout', 'State Machine 洗衣機', 'Sequence 與 Tick Count 計時'], l: '第 6 課、C4、C9、A2' },
    { f: 'lab-array.html', n: '陣列', ic: '[ ]', c: '#e8820c', d: '十個常用陣列函式，看元素怎麼搬。', t: ['Index、Insert、Delete、Replace、Subset…', '先預測再執行、隨機挑戰'], l: '第 7 課、C5' },
    { f: 'lab-string.html', n: '字串', ic: 'abc', c: '#c026d3', d: '一格一個字元，位置從 0 算起。', t: ['切、接、找、換九個函式', 'Format／Scan 格式碼對照', 'Normal、\'\\\' Codes、Hex 看控制碼'], l: '第 9 課、C6、F2' },
    { f: 'lab-cluster.html', n: '叢集', ic: '{ }', c: '#9333ea', d: '把資料打包、拆開，錯誤沿著錯誤線往後傳。', t: ['Bundle／Unbundle 與 By Name', 'Type Def 一改全部跟著改', '錯誤叢集怎麼流、Close 為什麼照樣執行'], l: '第 8、11 課、C10、C18' },
    { f: 'lab-prop.html', n: '屬性節點', ic: 'P', c: '#be185d', d: '用程式改前面板：顏色、反灰、閃爍，還有會不會觸發事件。', t: ['Visible、Disabled 0/1/2、Blinking、顏色', 'Value、Value (Signaling)、Local Variable：誰會觸發事件', '控制參考傳進 SubVI，一次 Disable 一組按鈕'], l: '第 18 課、C7、C11' },
    { f: 'lab-subvi.html', n: 'SubVI', ic: 'VI', c: '#1d4ed8', d: '接線端怎麼配、必要輸入沒接會怎樣、兩個迴圈同時呼叫誰要等。', t: ['4-2-2-4 接線端：輸入在左、輸出在右、錯誤在下角', 'Required／Recommended／Optional 沒接的差別', '可重入：排隊等待與各自一份記憶'], l: '第 10 課、C7' },
    { f: 'lab-formula.html', n: 'Formula Node', ic: 'f(x)', c: '#a16207', d: '同一個公式：拉線版和文字版並排算，打錯字當場告訴你。', t: ['圖形節點與 Formula Node 對照，一步一步高亮', '語法檢查器：少分號、沒宣告、大小寫', '整數除法、Quotient & Remainder 分組動畫'], l: 'C2、C4' },
    { f: 'lab-graph.html', n: '圖表', ic: '∿', c: '#0f766e', d: 'Chart 會記住舊資料，Graph 每次整張換掉。', t: ['六種資料型別各畫出什麼', 'XY Graph 用兩個陣列畫圓'], l: 'C11、C14' },
    { f: 'lab-var.html', n: '變數', ic: 'x', c: '#7c3aed', d: '兩個迴圈共用一個變數，資料是怎麼不見的。', t: ['競爭條件：你來當排程器', '一顆 Stop 停兩個迴圈的四種接法', 'FGV 功能型全域變數'], l: '第 16 課、C8' },
    { f: 'lab-queue.html', n: '佇列', ic: 'Q', c: '#0891b2', d: '迴圈之間傳資料：一筆都不能少用 Queue，只要最新用 Notifier。', t: ['生產者、佇列、消費者三欄動畫', 'Queue、Notifier、Local Variable 比一比', 'Producer/Consumer 怎麼關才不掉資料'], l: '第 16 課、C8、A2' },
    { f: 'lab-daq.html', n: 'DAQ', ic: 'AI', c: '#dc2626', d: '資料擷取的三個 R：取樣率、解析度、範圍。', t: ['取樣率不夠時的混疊', '解析度與範圍：最小可分辨電壓', 'DAQmx 流程與緩衝區溢位'], l: 'C12' },
    { f: 'lab-wave.html', n: '波形與分析', ic: '∑', c: '#4d7c0f', d: 'Waveform 帶著自己的時間；平均、RMS、標準差、移動平均一看就懂。', t: ['Build／Get Waveform：t0、dt、Y', 'Mean、σ、RMS、Peak-to-Peak 畫在圖上', '移動平均：N 越大越平但越慢'], l: 'C11、C12' },
    { f: 'lab-visa.html', n: 'VISA 序列通訊', ic: 'TX', c: '#475569', d: '位元組怎麼在線上走、VISA Read 什麼時候返回。', t: ['鮑率、資料位元、同位、停止位元的波形', 'Read 的三個返回條件：筆數、終止字元、逾時', 'Bytes at Port 的陷阱'], l: '第 12～14 課' },
    { f: 'lab-file.html', n: '檔案 I/O', ic: 'CSV', c: '#15803d', d: '開檔方式選錯會清空或出錯；往後加要先移檔案指標。', t: ['6 種 operation × 檔案在不在：錯誤 7、10、43', '檔案指標：覆蓋還是往後加', '寫 CSV：分隔符號、換行、小數位數'], l: 'F1～F5、C6' },
    { f: 'fxlab.html', n: 'FX 封包練習台', ic: 'ENQ', c: '#334155', d: '對一台模擬的 FX PLC 送封包，看它怎麼回。', t: ['讀寫 D 暫存器、ACK／NAK', '10 個任務、封包解碼練習'], l: '第 9、12～14 課' }
  ];
  var seen = {}; try { seen = JSON.parse(localStorage.getItem('ll_lv_labs_seen') || '{}'); } catch (e) {}
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  var hub = document.getElementById('hub'), order = document.getElementById('order'), n = 0;
  LABS.forEach(function (L, i) {
    var a = document.createElement('a'); a.className = 'card'; a.href = L.f;
    a.innerHTML = (seen[L.f] ? '<span class="seen">✔ 去過</span>' : '') + '<h2><span class="ic" style="background:' + L.c + '">' + esc(L.ic) + '</span>' + esc(L.n) + '</h2><p>' + esc(L.d) + '</p><ul>' + L.t.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul><div class="les">對應課程：' + esc(L.l) + '</div>';
    a.addEventListener('click', function () { seen[L.f] = 1; try { localStorage.setItem('ll_lv_labs_seen', JSON.stringify(seen)); } catch (e) {} });
    hub.appendChild(a);
    if (seen[L.f]) n++;
    var o = document.createElement('a'); o.href = L.f; o.textContent = (i + 1) + '. ' + L.n; order.appendChild(o);
    if (i < LABS.length - 1) order.appendChild(document.createTextNode('→'));
  });
  document.getElementById('prog').textContent = n ? '你已經去過 ' + n + ' / ' + LABS.length + ' 個（只記在這台瀏覽器）。' : '';
})();
