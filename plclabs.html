<script>

    { f: 'lab-timer.html', n: '計時器與計數器', ic: 'T/C', c: '#0e7490', d: '100 ms、1 ms、積算計時器；計數器只在上升緣加 1；停電保持。', t: ['一般計時器放開就歸零、積算型要 RST', '計數器 C0 停電歸零、C16 保留', '接點寫在線圈上面或下面差一圈'], l: '第 3 章' },
    { f: 'lab-data.html', n: '數值指令', ic: 'D', c: '#7c3aed', d: '位元、字、數字怎麼搬：K2Y、CMP、ZCP、BCD、移位。', t: ['K1X、K2Y 的位數組合', 'CMP、ZCP 輸出三個 M', 'BIN／BCD 與七段顯示、SFTL 跑馬燈'], l: '第 3 章' },

    { f: 'lab-pneu.html', n: '氣壓缸與電磁閥', ic: 'A±', c: '#475569', d: '位移－時間圖動起來：單線圈、雙線圈、5/3 三種中位（中封、中位加壓、中位排氣），急停時各怎麼停。', t: ['三種閥的動作與斷電行為', '動作順序自動畫成位移－時間圖', '感測器就是轉移條件'], l: '第 4 章、技能檢定' },
    { f: 'lab-trouble.html', n: '故障排除實戰', ic: '?!', c: '#be123c', d: '報修單上只有一句話：看燈、看監看、量電壓，用最少時間找出哪裡壞。', t: ['16 個情境：輸送帶、氣缸推料、自動門', '每查一項都要花時間，結算時和最少時間比較', '照先看燈、再監看、最後量的順序'], l: '第 6 章故障排除' },

    if (L.soon) return;
    n++;
    var a = document.createElement('a'); a.className = 'card'; a.href = L.f; a.style.setProperty('--card-c', L.c);
    a.innerHTML = '<h2><span class="ic" style="background:' + L.c + (L.tc ? ';color:' + L.tc : '') + '">' + esc(L.ic) + '</span>' + esc(L.n) + '</h2><p>' + esc(L.d) + '</p><ul>' + L.t.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul><div class="les">對應：' + esc(L.l) + '</div>';

    if (order.children.length) order.appendChild(document.createTextNode('→'));
    var o = document.createElement('a'); o.href = L.f; o.textContent = n + '. ' + L.n; order.appendChild(o);
